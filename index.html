<style>

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}

const D=[
["Kallisztratosz","„a legszebb sereg”","férfi",52,"Athén","pol","pentakosziomedimnosz (legfelső vagyonosztály)","földbirtokos, triérarkhosz",5,"kb. 15 talentum: olajfaligetek Attikában, laureioni bányabérlet, 40 rabszolga","Évente saját költségén szerel fel egy hadihajót (triérarkhia, kb. 1 talentum). A népgyűlésen arisztokratikus modora miatt sokan gyanakodnak rá.","Szavaz, minden tisztségre választható, sztratégosz is lehet.","Ha Spárta betör Attikába, a birtokait felégetik; a falak mögé kell költöztetnie a háztartását."],
["Arkhesztraté","„a sereg vezetője”","nő",34,"Athén","csal","athéni polgár felesége","háztartásvezető (oikosz úrnője)",4,"3000 drachma hozomány, de azt a férje (kíriosza) kezeli","Irányítja a rabszolganőket, a szövést, a raktárt és a gyerekek nevelését. Nyilvánosan főleg vallási ünnepeken jelenik meg.","Polgár anyaként fia polgárjogának feltétele; papnői tisztséget viselhet, vagyonnal önállóan nem rendelkezik.","Ha a férje meghal a háborúban, hozománya visszaszáll az apai családra, ő pedig új kíriosz alá kerül."],
["Lükón","„farkaskölyök”","férfi",41,"Athén","pol","thész (legalsó vagyonosztály)","evezős a flottában, a Pireuszban rakodó",1,"föld nincs; napi 3 obolosz–1 drachma, szolgálat idején zsold","A flotta motorja: evezőpadon ül, és ő tölti meg a népgyűlést. Periklész politikájának hűséges híve.","Szavaz, esküdtbíró lehet (napi 2 obolosz), sorsolással tisztséget kaphat.","Ha a hajó nem fut ki, nincs keresete; a zsúfolt városban fél a járványtól."],
["Manész","phrüg rabszolganév","férfi",28,"Athén (Laureion)","rab","bányarabszolga","ezüstbányász",0,"semmi; egy bérlő tulajdona, aki napi 1 oboloszért bérbe adja","Szűk tárnákban, mécses fényénél vájja az ércet. Társai között frígek, thrákok, paphlagónok vannak; görögül alig beszél.","Jogi személy nincs; megölése tiltott, de bántalmazása gyakorlatilag büntetlen.","A tárnák beomlása és a por. Ha az ellenség közel ér, talán megszökhet."],
["Thraitta","„thrák nő”","nő",19,"Athén","rab","házi rabszolganő","dajka",0,"semmi; vételára kb. 180 drachma volt","Kalózok rabolták el gyerekként egy thrák faluból. Most egy polgárcsalád kisfiát szoptatja és dajkálja; a gyerek őt szereti legjobban.","Nincs; tanúvallomását a bíróság csak kínvallatás alatt fogadja el.","Hogy a gyerek elválasztása után eladják."],
["Ksenarkhosz","„az idegenek vezére”","férfi",47,"Athén (Pireusz)","szab","metoikosz Milétoszból","pajzskészítő műhely tulajdonosa",4,"kb. 6 talentum; műhely 30 rabszolgával, saját ház nincs (földet nem birtokolhat)","Harminc éve él Athénban, a háborús megrendelések gazdaggá teszik. Szókratész barátai néha nála vacsoráznak.","Nem szavaz, földet nem vehet; évi 12 drachma metoikion-adót fizet, hoplitaként szolgál, kell egy athéni pártfogó (prosztatész).","Hogy egy irigy szükophantész feljelentse; polgárjogot sosem kaphat."],
["Glükera","„édes”","nő",26,"Athén","szab","metoikosz Korinthoszból","hetaira (művelt társalgónő)",3,"ékszerek, saját bérelt ház, két szolgálólány","Lakomákon zenél, vitázik, verset idéz; több tudást szerzett, mint a legtöbb polgárfeleség. Megélhetése férfi pártfogókon múlik.","Évi 6 drachma metoikion-adót fizet; házasságra polgárral nem léphet, gyerekei nem lehetnek polgárok.","Hogy idősebb korára elfogynak a pártfogók."],
["Phaidimosz","„ragyogó”","férfi",38,"Athén (Kerameikosz)","pol","zeugitész (hoplita vagyonosztály)","fazekasmester, vörösalakos vázák",2,"műhely, égetőkemence, két rabszolga segéd, kis földdarab","A Kerameikosz negyedben dolgozik, vázáit Etruriáig szállítják. Szívesen fest jeleneteket a hétköznapi életből.","Szavaz, hoplitaként szolgál, saját fegyverzetét maga veszi.","A korinthoszi piacok elvesztése és az, hogy hadba kell vonulnia."],
["Démokharész","„a nép öröme”","férfi",18,"Athén","pol","frissen bejegyzett polgár","határőr (peripolosz) szolgálatban",3,"apja közepes birtokának várományosa","Most vették fel démosza listájára; két évig Attika erődeiben őrködik. Szofisták előadásaira jár, és vitatkozik az apjával.","Szavazhat a népgyűlésen; tisztséget csak 30 évesen viselhet.","Bizonyítani akar az első csatában."],
["Kleioboulé","„a híres tanácsú”","nő",63,"Athén","csal","előkelő nemzetség (Eteobutadák) leánya","Athéné Poliasz papnője",4,"családi birtok, papi járandóságok az áldozatokból","Az Akropolisz legfontosabb kultuszát vezeti, a Panathénaia-ünnep egyik főszereplője. Tekintélye a politikusoknál is nagy.","Politikai joga nincs, de vallási tekintélye révén a polisz egyik legbefolyásosabb nője.","Hogy az isteni jelek rosszat sejtetnek a háborúhoz."],
["Phanosztraté","„a fényes sereg”","nő",55,"Athén","csal","polgárnő, özvegy","bába és gyógyfüves asszony",1,"kis ház, a szülések után kapott ajándékok","Szinte minden szomszédos ház gyerekét ő segítette világra. Fiával él, akinek szűkös a keresete.","Politikai joga nincs; özvegyként fia a kíriosza.","Az ostrom alatt összezsúfolódott városban egyre több beteg."],
["Ariapeithész","szkíta név","férfi",30,"Athén","rab","közrabszolga (démosziosz)","szkíta íjász, rendfenntartó",0,"saját vagyona nincs; a polisz ellátja","A népgyűlésen ő tereli a polgárokat, a piacon rendet tart. Görögjén nevetnek a komédiákban.","Rabszolga, de a polisz tulajdona; nagyobb önállósága van, mint a házi rabszolgáknak.","Hogy a polgárok megvetik, miközben neki kell fegyelmeznie őket."],
["Mürrhiné","„mirtusz”","nő",44,"Athén","csal","szegény polgárnő","kenyérárus az agorán",1,"egy kemence és a napi bevétel, néhány obolosz","Hajnalban süt, napközben az agorán árul és vitatkozik a vevőkkel. A szegény polgárnőknek nincs módjuk otthon maradni.","Politikai joga nincs; árusként a piacfelügyelők alá tartozik.","Ha a gabonahajók nem érkeznek, drága a liszt."],
["Pamphilosz","„mindenki kedvence”","férfi",11,"Athén","csal","polgár fia","iskolás",3,"apja műhelytulajdonos","Reggel a grammatisztésznél betűt vet, majd lantot tanul és a palaisztrában birkózik. Homéroszból hosszú részeket tud fejből.","Kiskorú; 18 évesen lehet polgár, ha mindkét szülője athéni.","Hogy a paidagógosza mindent elmond az apjának."],
["Szürosz","„a szír”","férfi",61,"Athén","rab","házi rabszolga","paidagógosz (gyermekkísérő)",0,"némi megtakarítás (peculium), amiből szabadulását remélné","Harminc éve szolgálja a családot, most Pamphiloszt kíséri iskolába és vigyáz az erkölcseire.","Nincs; felszabadítása gazdája döntésén múlik.","Hogy öregen eladják vagy kiteszik."],
["Damatriosz","„Démétérhez tartozó”","férfi",35,"Spárta","pol","spártiáta (homoiosz, „egyenlő”)","hoplita, katona",3,"állami földtelek (klérosz) helótákkal; pénzt nem használ, csak vaspénzt","Hétéves korától katonai nevelésben élt; ma is közös étkezésre (szüszszitia) jár. Kereskedni és kézművességet űzni tilos neki.","Részt vesz a népgyűlésen (apella), 60 éves kor után a gerusziába választható.","Ha nem tudja befizetni a havi gabona-hozzájárulást a közös étkezéshez, elveszti polgárjogát."],
["Deinikha","„rettentő győzelem”","nő",39,"Spárta","csal","spártiáta nő","birtokkezelő, anya",4,"örökölt földek; a spártai nők birtokolhatnak földet","Míg férje táborban van, ő irányítja a helótákat és a gazdaságot. Lányát versenyfutásra edzi.","Politikai joga nincs, de gazdasági önállósága nagyobb, mint az athéni nőké.","Hogy fia nem állja ki az agógét, vagy pajzs nélkül tér haza."],
["Antiokhosz","„a kitartó”","férfi",13,"Spárta","csal","spártiáta fiú","agógé-növendék",3,"családi klérosz várományosa","Mezítláb jár, egy köpenyt kap egy évre, nádágyon alszik. A túléléshez lopnia kell; ha rajtakapják, megverik.","Még nem polgár; 30 évesen lesz teljes jogú.","Az éhség és az idősebb fiúk fegyelmezése."],
["Kallón","„szépség”","férfi",33,"Messzénia","hel","helóta (állami tulajdonú földművelő)","földműves egy spártai kléroszon",1,"kunyhó, néhány eszköz; a termés jelentős részét be kell szolgáltatnia","Nagyapja részt vett a Kr. e. 464-es messzéniai felkelésben. Titokban a régi szabadságról mesélnek egymásnak.","Nem adható el külföldre, de bármikor megölhetik: az ephoroszok évente hadat üzennek a helótáknak.","A krüpteia: fiatal spártaiak éjjel a túl erős vagy gyanús helótákra vadásznak."],
["Melitta","„méhecske”","nő",25,"Lakónia","hel","helóta","földműves és szövő",0,"semmi, ami az övé lenne","Gazdasszonya házában is szolgál. Gyermekei is helóták lesznek.","Nincs; családja együtt maradhat, amíg a spártaiak úgy akarják.","Hogy a férjét elviszik a hadsereggel teherhordónak."],
["Timokratész","„a tisztelet ereje”","férfi",50,"Gütheion (Lakónia)","szab","perioikosz (körüllakó)","bronzműves, fegyverkovács és kereskedő",3,"saját műhely és ház, pénzt használhat","Ő kovácsolja a spártai sereg lándzsahegyeit. A spártaiak helyett ő kereskedik.","Szabad, saját közössége ügyeit intézi, hoplitaként szolgál; spártai politikai joga nincs.","Hogy a háborúban a tengerparti települését az athéni flotta feldúlja."],
["Ariszteasz","„a legjobb”","férfi",45,"Korinthosz","pol","polgár (oligarchikus vezetőréteg)","hajótulajdonos kereskedő (naukléros)",4,"3 kereskedőhajó, raktár a Lekhaion kikötőben","Korinthosz két tenger közti helyzetéből gazdagodott meg. Ő sürgeti a legjobban Spártát a háborúra.","Szavaz, a tanácsba választható; az oligarchia a vagyonosoknak kedvez.","Az athéni flotta elzárja a nyugati kereskedelmi utakat."],
["Lüsziasz","„a megszabadító”","férfi",29,"Korinthosz","pol","szegény polgár","hajóvontató a diolkoszon",1,"napszám, egy bérelt szoba","Csapatával hajókat húz át a földszoroson, kőpályán. Kevés beleszólása van a politikába.","Polgár, de a vagyoni cenzus miatt a fontos tisztségekből kizárt.","Ha a kereskedelem leáll, munka nélkül marad."],

const N=D.length;
const slotId=i=>"k"+String(i+1).padStart(2,"0");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const app=document.getElementById("app");

// Rögzített keverés a sorszámos kiosztáshoz (minden eszközön ugyanaz)
function seeded(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const PERM=(()=>{const a=[...Array(N).keys()],r=seeded(431);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a})();

function cardHTML(i,extra){
  const [nev,jel,nem,kor,pol,st,stR,fogl,vs,vagy,leir,jog,gond]=D[i];
  const ob='<span class="obols" aria-label="vagyonszint '+vs+' az 5-ből">'+[1,2,3,4,5].map(k=>'<i class="'+(k<=vs?'f':'')+'"></i>').join("")+'</span>';
  return '<article class="card" style="--c:var('+STATUS[st].c+')"><div class="band"></div>'+
   '<div class="top"><span class="st">'+STATUS[st].label+'</span><span>'+pol+'</span></div>'+
   '<div class="name"><h2>'+nev+'</h2><div class="mean">'+jel+'</div></div>'+
   '<dl class="facts"><dt>Kor, nem</dt><dd>'+kor+' éves '+nem+'</dd>'+
   '<dt>Jogállás</dt><dd>'+stR+'</dd><dt>Foglalkozás</dt><dd>'+fogl+'</dd>'+
   '<dt>Vagyon</dt><dd>'+ob+vagy+'</dd></dl>'+
   '<div class="body"><p>'+leir+'</p><p><b>Jogai</b>'+jog+'</p><p><b>Gondja</b>'+gond+'</p></div>'+
   '<div class="foot"><span>Kártya '+String(i+1).padStart(2,"0")+' / '+N+'</span>'+(extra||"")+'</div></article>';
}
function soloShell(inner){
  app.innerHTML='<div class="solo"><header><div class="eyebrow">Szerepkártya · Kr. e. 431 tavasza</div><h1>Hellász 35 arca</h1></header>'+inner+'</div>';
}
function showMine(i,how){
  soloShell('<p class="status">'+how+'</p>'+cardHTML(i));
}

// ---------- Sorszámos mód (mindenkinek működik, bejelentkezés nélkül is) ----------
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function fallback(reason){
  const saved=parseInt(lsGet("hellasz-sorszam")||"",10);
  soloShell((reason?'<div class="note">'+reason+'</div>':'')+
    '<p class="status">Írd be a naplóbeli sorszámodat: minden sorszámhoz más karakter tartozik.</p>'+
    '<form class="ask" id="f"><label for="n">Sorszám<input id="n" type="number" min="1" max="'+N+'" inputmode="numeric" value="'+(saved>=1&&saved<=N?saved:"")+'"></label>'+
    '<button class="btn" type="submit">Kártyám</button><span class="err" id="e" hidden></span></form><div id="out"></div>');
  const f=document.getElementById("f"),e=document.getElementById("e"),out=document.getElementById("out");
  function go(n){out.innerHTML=cardHTML(PERM[n-1]);}
  if(saved>=1&&saved<=N)go(saved);
  f.addEventListener("submit",ev=>{ev.preventDefault();
    const n=parseInt(document.getElementById("n").value,10);
    if(!(n>=1&&n<=N)){e.hidden=false;e.textContent="1 és "+N+" közötti számot adj meg.";return}
    e.hidden=true;lsSet("hellasz-sorszam",String(n));go(n);
  });
}

// ---------- Tanárnézet ----------
function teacher(db,user){
  let slots={},confirming=false,names={};
  app.innerHTML='<header><div class="eyebrow">Tanárnézet · csak te látod</div><h1>Hellász 35 arca</h1>'+
   '<p>A link megnyitásakor minden diák automatikusan egy még szabad karaktert kap. Itt követheted, ki melyiket kapta. Akinek nincs írási joga, sorszám alapján kap kártyát; a táblázat megmutatja, melyik sorszámhoz melyik karakter tartozik.</p></header>'+
   '<div class="teacherbar"><div class="stat" id="cnt">–<small>kiosztva</small></div><div class="spacer"></div><div id="act"></div></div>'+
   '<details class="map"><summary>Sorszám → karakter táblázat (bejelentkezés nélküli diákoknak)</summary><div class="maptab"><div class="cols">'+
   PERM.map((c,k)=>'<div>'+String(k+1).padStart(2," ")+'. &nbsp;'+D[c][0]+'</div>').join("")+'</div></div></details>'+
   '<div class="grid" id="grid"></div>';
  const grid=document.getElementById("grid"),act=document.getElementById("act"),cnt=document.getElementById("cnt");
  async function render(){
    const owners=Object.values(slots).map(s=>s.owner).filter(Boolean);
    if(user&&owners.length){try{names=await user.profiles([...new Set(owners)])||{}}catch(e){}}
    let taken=0;
    grid.innerHTML=D.map((_,i)=>{const s=slots[slotId(i)];
      if(s&&s.owner){taken++;const nm=(names[s.owner]&&names[s.owner].name)||"egy diák";return cardHTML(i,'<span class="tag taken">Kiosztva: '+esc(nm)+'</span>')}
      return cardHTML(i,'<span class="tag">Szabad</span>')}).join("");
    cnt.innerHTML=taken+' / '+N+'<small>kiosztva</small>';
    drawAct(taken);
  }
  function drawAct(taken){
    if(!db){act.innerHTML='<span class="status">A közös nyilvántartás most nem érhető el.</span>';return}
    if(confirming){act.innerHTML='<div class="confirm">Minden kiosztás törlődik. Biztos? <button class="btn danger" id="yes" type="button">Igen, nullázom</button><button class="btn ghost" id="no" type="button">Mégse</button></div>';
      document.getElementById("yes").onclick=reset;document.getElementById("no").onclick=()=>{confirming=false;drawAct(taken)};return}
    act.innerHTML='<button class="btn ghost" id="rst" type="button"'+(taken?'':' disabled')+'>Kiosztás nullázása új osztályhoz</button>';
    document.getElementById("rst").onclick=()=>{confirming=true;drawAct(taken)};
  }
  async function reset(){
    act.innerHTML='<span class="status">Nullázás…</span>';
    for(const id of Object.keys(slots)){try{await db.doc("slots/"+id).delete()}catch(e){}}
    confirming=false;
  }
  render();
  if(db){
    db.collection("slots").onSnapshot(snap=>{slots={};snap.docs.forEach(d=>{if(d.exists)slots[d.id]=d.data()});render()},
      ()=>{act.innerHTML='<span class="status">A kiosztási adatok nem érhetők el.</span>'});
  }
}

// ---------- Diák: automatikus kiosztás ----------
async function student(db,user){
  const id=await user.id();
  if(!id){fallback();return}
  if(await user.can("data.write")===false){
    fallback('<strong>Automatikus kiosztás most nem lehetséges</strong>, mert ehhez a linkhez csak olvasási jogod van. Használd a sorszámodat.');return}
  let done=false,claiming=false;
  const timer=setTimeout(()=>{if(!done){done=true;fallback('A közös nyilvántartás nem válaszol. Használd a sorszámodat.')}},10000);
  const unsub=db.collection("slots").onSnapshot(async snap=>{
    if(done||snap.metadata.fromCache)return;
    const mine=snap.docs.find(d=>d.exists&&d.data().owner===id);
    if(mine){done=true;clearTimeout(timer);unsub&&unsub();showMine(parseInt(mine.id.slice(1),10)-1,"Ez a te szereped. Ezt a kártyát kapod akkor is, ha újra megnyitod a linket.");return}
    if(claiming)return;claiming=true;clearTimeout(timer);
    const taken=new Set(snap.docs.filter(d=>d.exists&&d.data().owner).map(d=>d.id));
    const free=[...Array(N).keys()].map(slotId).filter(s=>!taken.has(s));
    for(let i=free.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[free[i],free[j]]=[free[j],free[i]]}
    for(const sid of free){
      try{
        const ref=db.doc("slots/"+sid);
        const r=await ref.acquire({holder:id,ttlMs:4000});
        if(!r.acquired)continue;
        const s=await ref.get();
        if(s.exists&&s.data().owner)continue;
        await ref.set({owner:id,at:Date.now()});
        done=true;unsub&&unsub();
        showMine(parseInt(sid.slice(1),10)-1,"Ez a te szereped. Ezt a kártyát kapod akkor is, ha újra megnyitod a linket.");
        return;
      }catch(e){
        if(e&&e.code==="invalid_argument"){done=true;unsub&&unsub();fallback('<strong>Automatikus kiosztás most nem lehetséges</strong>, mert ehhez a linkhez csak olvasási jogod van. Használd a sorszámodat.');return}
      }
    }
    done=true;unsub&&unsub();
    fallback('<strong>Mind a '+N+' karaktert kiosztották már.</strong> Kérj sorszámot a tanárodtól.');
  },()=>{if(!done){done=true;clearTimeout(timer);fallback('A közös nyilvántartás nem érhető el. Használd a sorszámodat.')}});
}

(async()=>{
  const use=window.claude&&window.claude.use;
  if(!use){fallback();return}
  const [user,db]=await Promise.all([window.claude.use("user"),window.claude.use("db")]);
  let owner=false;try{owner=user?await user.isOwner():false}catch(e){}
  if(owner){teacher(db,user);return}
  if(!db||!user){fallback();return}
  student(db,user);
})();
</script>
